name: PCA10059 Zephyr CI Pipeline

on:
  workflow_dispatch: # 核心配置，开启手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 使用家目录避免 sudo 权限问题
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/zephyr-sdk
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr

    steps:
      - name: 代码检出
        uses: actions/checkout@v4
        with:
          path: zephyr-repo

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 缓存 West 依赖模块
        id: cache-west
        uses: actions/cache@v4
        with:
          path: |
            .west
            modules
            tools
            zephyr
            bootloader
          key: ${{ runner.os }}-west-${{ hashFiles('zephyr-repo/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-west-

      - name: 初始化 West 工作区
        run: |
          pip install west
          # 仅在未初始化时执行 init
          if [ ! -d ".west" ]; then
            west init -l zephyr-repo
          fi
          west update --narrow -o=--depth=1
          west zephyr-export
          # 注意：west update 后的 zephyr 目录位置
          pip install -r zephyr/scripts/requirements.txt

      - name: 部署 Zephyr SDK (ARM Minimal)
        run: |
          SDK_VER="0.17.0"
          # 修正变量引用，加上花括号 {}
          FILE_NAME="zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz"
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VER}/${FILE_NAME}
          mkdir -p ${{ env.ZEPHYR_SDK_INSTALL_DIR }}
          tar -xJf ${FILE_NAME} -C ${{ env.ZEPHYR_SDK_INSTALL_DIR }} --strip-components=1
          # 执行设置脚本，安装 ARM 工具链
          ${{ env.ZEPHYR_SDK_INSTALL_DIR }}/setup.sh -t arm-zephyr-eabi

      - name: 执行固件编译 (Blinky 示例)
        run: |
          # 确保环境变量生效
          export ZEPHYR_SDK_INSTALL_DIR=${{ env.ZEPHYR_SDK_INSTALL_DIR }}
          west build -b nrf52840dongle/nrf52840 zephyr/samples/basic/blinky \
            -d build --pristine \
            -- -DCONFIG_BOARD_HAS_NRF5_BOOTLOADER=y \
               -DCONFIG_FLASH_LOAD_OFFSET=0x1000

      - name: 安装 nrfutil 并生成 DFU 升级包
        run: |
          curl -L https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil -o nrfutil
          chmod +x nrfutil
          # 移动到 PATH 路径以便直接调用
          sudo mv nrfutil /usr/local/bin/
          nrfutil install nrf5sdk-tools -y
          # 使用 pkg generate 生成 zip
          nrfutil nrf5sdk-tools pkg generate \
            --hw-version 52 --sd-req 0x00 --application-version 1 \
            --application build/zephyr/zephyr.hex \
            blinky_pca10059_dfu.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: nrf52840-dongle-hex-and-dfu
          path: |
            build/zephyr/zephyr.hex
            blinky_pca10059_dfu.zip
