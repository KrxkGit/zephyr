name: PCA10059 Zephyr CI Pipeline

on:
  workflow_dispatch: # 核心配置，开启手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZEPHYR_SDK_INSTALL_DIR: /opt/zephyr-sdk
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr

    steps:
      - name: 代码检出
        uses: actions/checkout@v4
        with:
          path: zephyr-repo

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 缓存 West 依赖模块
        id: cache-west
        uses: actions/cache@v4
        with:
          path: |
           .west
            modules
            tools
            zephyr
            bootloader
          key: ${{ runner.os }}-west-${{ hashFiles('zephyr-repo/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-west-

      - name: 初始化 West 工作区
        run: |
          pip install west
          west init -l zephyr-repo
          west update --narrow -o=--depth=1
          west zephyr-export
          pip install -r zephyr/scripts/requirements.txt

      - name: 部署 Zephyr SDK (ARM Minimal)
        run: |
          SDK_VER="0.17.0"
          wget https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v$SDK_VER/zephyr-sdk-$SDK_VER_linux-x86_64_minimal.tar.xz
          mkdir -p ${{ env.ZEPHYR_SDK_INSTALL_DIR }}
          tar -xvf zephyr-sdk-$SDK_VER_linux-x86_64_minimal.tar.xz -C ${{ env.ZEPHYR_SDK_INSTALL_DIR }} --strip-components=1
          cd ${{ env.ZEPHYR_SDK_INSTALL_DIR }} &&./setup.sh -t arm-zephyr-eabi

      - name: 执行固件编译 (Blinky 示例)
        run: |
          west build -b nrf52840dongle/nrf52840 zephyr/samples/basic/blinky \
            -d build --pristine \
            -- -DCONFIG_BOARD_HAS_NRF5_BOOTLOADER=y \
               -DCONFIG_FLASH_LOAD_OFFSET=0x1000

      - name: 安装 nrfutil 并生成 DFU 升级包
        run: |
          curl -L https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil -o nrfutil
          chmod +x nrfutil
         ./nrfutil install nrf5sdk-tools
         ./nrfutil nrf5sdk-tools pkg generate \
            --hw-version 52 --sd-req 0x00 --application-version 1 \
            --application build/zephyr/zephyr.hex \
            blinky_pca10059_dfu.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: nrf52840-dongle-hex-and-dfu
          path: |
            build/zephyr/zephyr.hex
            blinky_pca10059_dfu.zip
